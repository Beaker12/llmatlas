# Note: no Markdown formatter is configured on purpose. mdformat (without the MyST
# plugin) escapes LaTeX inside $...$ and corrupts every equation; see
# tests/test_math_not_escaped.py, which guards against that.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.ipynb$|^chapters/06-architectures/examples/data/)
      - id: end-of-file-fixer
        exclude: (\.ipynb$|^chapters/06-architectures/examples/data/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-json
        exclude: \.ipynb$

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203]
