# LLM Atlas configuration (Jupyter Book 1.x)

title: "LLM Atlas: A Guide to Large Language Models"
author: "Stuart W. Parkhurst"
copyright: "Stuart W. Parkhurst | Text and figures CC BY-NC-SA 4.0, code MIT"
logo: _static/logo.svg

only_build_toc_files: true

execute:
  # Notebooks are committed with executed outputs and re-executed by the CI
  # nbconvert step (see .github/workflows/pages.yml); the book build only runs a
  # notebook that is missing outputs.
  execute_notebooks: auto
  timeout: 120

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/Beaker12/llmatlas
  branch: main

html:
  favicon: _static/favicon.svg
  home_page_in_navbar: false
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  baseurl: "https://beaker12.github.io/llmatlas/"
  announcement: "Work in progress: chapters 1 to 5 are written. See the Roadmap for what is planned."

sphinx:
  recursive_update: true
  extra_extensions:
    - sphinxext.opengraph
  config:
    html_show_sourcelink: false
    bibtex_reference_style: author_year
    bibtex_default_style: plain
    ogp_site_url: "https://beaker12.github.io/llmatlas/"
    ogp_social_cards:
      enable: false
    linkcheck_ignore:
      - "https://doi.org/10.1162/.*"      # direct.mit.edu returns 403 to non-browser clients
      - "https://doi.org/10.1121/.*"      # pubs.aip.org returns 403 to non-browser clients
    linkcheck_timeout: 20
    exclude_patterns:
      - "_build/**"
      - ".jupyter_cache/**"
      - ".pytest_cache/**"
      - ".claude/**"
      - ".superpowers/**"
      - ".github/**"
      - ".venv/**"
      - "venv/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - "**/.ipynb_checkpoints"
