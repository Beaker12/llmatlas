# LLM Atlas configuration (Jupyter Book 1.x)

title: "LLM Atlas: A Guide to Large Language Models"
author: "Stuart W. Parkhurst"
copyright: "Stuart W. Parkhurst | Text and figures CC BY-NC-SA 4.0, code MIT"
logo: _static/logo.svg

only_build_toc_files: true

execute:
  # The book build never executes a notebook: outputs are committed, and
  # tests/test_notebook_outputs.py re-executes every notebook offline and compares
  # the results (see .github/workflows/pages.yml).
  execute_notebooks: "off"
  timeout: 600

latex:
  latex_engine: xelatex
  latex_documents:
    targetname: llmatlas.tex

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/Beaker12/llmatlas
  branch: main

html:
  favicon: _static/favicon.svg
  home_page_in_navbar: false
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  baseurl: "https://beaker12.github.io/llmatlas/"
  announcement: "Work in progress: chapters 1 to 6 are written. See the Roadmap for what is planned."

sphinx:
  recursive_update: true
  extra_extensions:
    - sphinxext.opengraph
  config:
    html_show_sourcelink: false
    bibtex_reference_style: author_year
    bibtex_default_style: plain
    ogp_site_url: "https://beaker12.github.io/llmatlas/"
    ogp_social_cards:
      enable: false
    latex_elements:
      # Non-Latin text under XeLaTeX. Fonts are named in the two \providecommand lines only.
      # Keep in sync with tools/latex_smoke/fonts.tex (the smoke test of this block); the font
      # names must also match the defaults in tools/latex_smoke/check_pdf.sh.
      # ucharclasses is loaded before xeCJK, which otherwise stops handling CJK text.
      preamble: |
        \providecommand{\cjkfontname}{Noto Sans CJK SC}
        \providecommand{\arabicfontname}{Noto Naskh Arabic}
        \usepackage[Latin,Greek,Arabic]{ucharclasses}  % superset of sphinx-jupyterbook-latex's options (it loads it again); Arabic makes \setTransitionsFor{Arabic} fire
        \usepackage{xeCJK}
        \xeCJKDeclareCharClass{Default}{"00B7, "2013, "2014, "2018, "2019, "201C, "201D, "2026}  % middle dot, dashes, curly quotes and ellipsis stay in the Latin font
        \setCJKmainfont{\cjkfontname}
        \setCJKmonofont{\cjkfontname}
        \usepackage{bidi}
        \newfontfamily\arabicfont[Script=Arabic]{\arabicfontname}
        \setTransitionsFor{Arabic}{\begingroup\arabicfont\beginR}{\endR\endgroup}
        % A {cite:t} in a figure caption otherwise stops XeLaTeX ("Argument of \Hy@tempa has an extra }").
        \usepackage{etoolbox}\robustify{\DUrole}\robustify{\hyperlink}\robustify{\sphinxstyleemphasis}
        % The pages number their own section headings ("1.1 The published mixtures"): LaTeX numbers chapters only.
        \setcounter{secnumdepth}{0}
    linkcheck_ignore:
      - "https://doi.org/10.1145/.*"      # dl.acm.org returns 403 to non-browser clients
      - "https://doi.org/10.1162/.*"      # direct.mit.edu returns 403 to non-browser clients
      - "https://doi.org/10.1121/.*"      # pubs.aip.org returns 403 to non-browser clients
    linkcheck_timeout: 20
    exclude_patterns:
      - "_build/**"
      - ".jupyter_cache/**"
      - ".pytest_cache/**"
      - ".claude/**"
      - ".superpowers/**"
      - ".github/**"
      - ".venv/**"
      - "venv/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - "**/.ipynb_checkpoints"
