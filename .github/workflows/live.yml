name: Live checks

# Checks that need the network: live notebook runs, link check, arXiv metadata.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      LLMATLAS_LIVE: "1"
      LLMATLAS_USER_AGENT: "llm-atlas-ci (+https://github.com/Beaker12/llmatlas)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu -c constraints.txt
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Live tests
        run: pytest -m live tests/

      - name: Check external links
        run: make linkcheck VENV_DIR=$(dirname "$(dirname "$(which python)")")

      - name: Verify arXiv and Crossref metadata
        run: python tools/verify_arxiv.py
